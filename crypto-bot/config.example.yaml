# Copy to config.yaml and tune. All money values are in SOL unless noted.

pair:
  # The token you are trading. DEFAULT IS PONKE. VERIFY THIS MINT ON A BLOCK EXPLORER
  # (https://explorer.solana.com/address/<mint>) BEFORE LIVE TRADING. A wrong mint
  # means you buy a worthless/scam token.
  base_mint: "5z3EqYQo9HiCEs3R84RCDMu2n7anpDMxRhdK8PSWmrRC"   # PONKE
  base_symbol: "PONKE"
  base_decimals: 9
  quote_mint: "So11111111111111111111111111111111111111112"   # Wrapped SOL
  quote_symbol: "SOL"
  quote_decimals: 9

engine:
  poll_seconds: 60            # how often to check price + act
  price_probe_sol: 0.05       # notional used to read a live price via a Jupiter quote
  state_dir: "state"          # portfolio + history persisted here

# ---- Risk limits. These are HARD caps. The bot will refuse trades that violate them. ----
risk:
  starting_sol: 1.0           # paper-mode starting balance (ignored in live mode — real balance is used)
  max_position_sol: 0.25      # never hold more than this much SOL worth of the token
  per_trade_sol: 0.05         # size of each buy
  max_total_invested_sol: 0.5 # lifetime cap on SOL deployed into the token
  max_daily_spend_sol: 0.2    # cap on SOL spent buying per UTC day
  daily_loss_limit_sol: 0.15  # if realized+unrealized loss for the day exceeds this, STOP trading
  max_slippage_bps: 100       # 100 = 1.0% max slippage on any swap; trade aborts if quote is worse
  min_seconds_between_trades: 120
  kill_switch_file: "STOP"    # create a file with this name in the bot dir to halt all trading

# ---- Strategy parameters ----
strategy:
  name: "momentum"            # "momentum" (SMA cross + RSI filter) or "dca" (time-based buys)
  fast_window: 10             # samples for fast SMA
  slow_window: 30             # samples for slow SMA
  rsi_window: 14
  rsi_overbought: 75          # don't buy above this RSI
  rsi_oversold: 30
  take_profit_pct: 30.0       # sell position when up this % vs avg cost
  stop_loss_pct: 15.0         # sell position when down this % vs avg cost (capital preservation)
  dca_interval_minutes: 60    # only used by the "dca" strategy
